name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm install, not npm ci: the lockfile is generated on Windows and cannot
      # record sharp's Linux-only optional deps, so npm ci refuses to install.
      - run: npm install --no-audit --no-fund

      - name: Build static export
        env:
          # Preview lives at rankify-ops.github.io/aerial-image/.
          # At domain cutover: delete this line AND add public/CNAME, together —
          # one without the other 404s every asset.
          NEXT_PUBLIC_BASE_PATH: /aerial-image
        run: npm run build

      - name: Disable Jekyll
        # Without this Pages drops every directory starting with an underscore,
        # including _next, and the site deploys "successfully" but unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
